name: Build robot firmware

on:
  push:
    branches: [main]
    paths:
      - 'firmware/array_sim_fw/**'
      - 'cpp/array_biped.hpp'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: ESP32 core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.0.7
          arduino-cli lib install "Adafruit PWM Servo Driver Library" "Adafruit MPU6050"
      - name: Compile
        run: |
          cp cpp/array_biped.hpp firmware/array_sim_fw/
          arduino-cli compile --fqbn esp32:esp32:esp32 --warnings default --export-binaries --output-dir build firmware/array_sim_fw
          ls -la build
          if [ ! -f build/array_sim_fw.ino.merged.bin ]; then
            ESPTOOL=$(ls -d ~/.arduino15/packages/esp32/tools/esptool_py/*/ | head -1)
            python3 "$ESPTOOL/esptool.py" --chip esp32 merge_bin -o build/array_sim_fw.ino.merged.bin \
              0x1000 build/array_sim_fw.ino.bootloader.bin 0x8000 build/array_sim_fw.ino.partitions.bin \
              0xe000 ~/.arduino15/packages/esp32/hardware/esp32/*/tools/partitions/boot_app0.bin 0x10000 build/array_sim_fw.ino.bin
          fi
          cp build/array_sim_fw.ino.merged.bin firmware/bin/array_sim_fw.bin
          VER=$(sed -n 's/^#define FW_VERSION "\(.*\)"/\1/p' firmware/array_sim_fw/array_sim_fw.ino)
          printf '{"version": "%s", "commit": "%s", "built": "%s"}\n' "$VER" "${GITHUB_SHA::7}" "$(date -u +%FT%TZ)" > firmware/bin/build.json
      - name: Publish the binary on the site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/bin firmware/array_sim_fw/array_biped.hpp
          git diff --cached --quiet && exit 0
          git commit -m "Build robot firmware ${GITHUB_SHA::7}"
          git pull --rebase origin main
          git push
